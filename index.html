<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>柴犬ラン 5</title>
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  --border:rgba(20,30,40,0.18);
  --surface-2:#ffffff;
  --text-primary:#1b2430;
  --text-secondary:#46525f;
  --text-muted:#8a929e;
}
*{box-sizing:border-box;}
body{margin:0;padding:16px;background:#eef4f8;font-family:var(--font-sans);}
button{font-family:inherit;font-weight:500;color:var(--text-primary);background:#ffffff;border:1px solid var(--border);border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:active{background:#dbe6ee;}
#ovB{background:#2f6fed;border:none;color:#ffffff;}
#ovB:active{background:#245ac6;}
</style>
</head>
<body>
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">柴犬を操作しショットやチャージショットで戦いながら骨を集め、ボスネコを倒して犬小屋を目指す横スクロールアクションゲームの軽量化版</h2>
<div id="shibaWrap" style="max-width:640px;margin:0 auto;font-family:var(--font-sans);-webkit-user-select:none;user-select:none;">
  <div id="stage" style="position:relative;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);background:#8ed4f7;">
    <canvas id="cv" width="640" height="480" style="display:block;width:100%;height:auto;touch-action:none;"></canvas>
    <div id="ov" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,25,35,0.45);">
      <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1.25rem 1.5rem;text-align:center;max-width:84%;">
        <p id="ovT" style="font-size:22px;font-weight:500;margin:0 0 8px;color:var(--text-primary);">柴犬ラン 5</p>
        <p id="ovD" style="font-size:13px;line-height:1.7;margin:0 0 14px;color:var(--text-secondary);">ワンショットで敵を撃てる。長押しでチャージショット。<br>HP制。砲台ネコの弾に注意。骨20本で1UP、肉で無敵＋全回復。<br>最深部のボス「ニャン大将」を倒して犬小屋へ。</p>
        <button id="ovB" style="font-size:15px;padding:9px 24px;">▶ スタート</button>
      </div>
    </div>
  </div>
  <div id="ctrl" style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;touch-action:none;">
    <div style="display:flex;gap:8px;">
      <button class="cbtn" id="bL" aria-label="左へ移動" style="min-width:58px;height:56px;font-size:20px;touch-action:none;">←</button>
      <button class="cbtn" id="bR" aria-label="右へ移動" style="min-width:58px;height:56px;font-size:20px;touch-action:none;">→</button>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="cbtn" id="bS" style="min-width:82px;height:56px;font-size:14px;font-weight:500;touch-action:none;">⚡ ショット</button>
      <button class="cbtn" id="bJ" style="min-width:82px;height:56px;font-size:14px;font-weight:500;touch-action:none;">↑ ジャンプ</button>
    </div>
  </div>
  <p style="margin:8px 0 0;text-align:center;font-size:11px;color:var(--text-muted);">PC：← → 移動 ／ スペース＝ジャンプ（空中で2段） ／ Z・X＝ショット（長押しでチャージ）</p>
</div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');

var g=[],r,i,j;
for(r=0;r<ROWS;r++){g.push(new Array(COLS).fill('.'));}
function F(c1,c2,r1,r2){for(var rr=r1;rr<=r2;rr++)for(var cc=c1;cc<=c2;cc++)g[rr][cc]='#';}
F(0,18,11,11);F(22,40,11,11);F(46,53,11,11);F(57,100,11,11);F(107,121,11,11);F(125,151,11,11);F(159,180,11,11);F(184,199,11,11);F(208,231,11,11);F(235,259,11,11);
F(13,15,8,8);F(32,34,8,8);F(36,38,6,6);F(42,44,8,8);
F(62,62,10,10);F(63,63,9,10);F(64,65,8,10);F(70,72,7,7);
F(94,97,5,5);
F(144,146,6,6);F(149,151,4,4);F(154,156,8,8);
F(170,170,10,10);F(171,171,9,10);F(172,173,8,10);F(177,179,6,6);
F(217,219,4,4);F(240,243,4,4);
var BONES=[];
function addB(c1,c2,rr){for(var cc=c1;cc<=c2;cc++)BONES.push({x:cc*T+T/2,y:rr*T+T/2});}
addB(6,8,10);addB(13,15,7);addB(36,38,5);addB(42,44,7);addB(54,56,9);addB(70,72,6);addB(78,80,10);addB(84,86,10);
addB(94,97,4);addB(122,124,9);addB(127,131,3);
addB(144,146,5);addB(149,151,3);addB(154,156,7);addB(172,173,7);addB(177,179,5);addB(195,197,10);addB(217,219,3);addB(232,234,9);addB(240,243,3);addB(246,248,10);
var NB=BONES.length;
var CATS0=[26,50,68,82,113,116,162,165,192,222,226];
var CROWS0=[[96,100,220,1.3],[115,120,344,1.6],[126,131,240,1.4],[144,151,310,1.4],[188,194,340,1.7],[190,196,250,1.5],[201,207,270,1.5]];
var TURS0=[75,119,168,228];
var SPRINGS0=[91,129,141,238];
var MEATS0=[[110*T+8,348],[186*T+8,348]];
var CHKS=[48*T,108*T,160*T,210*T],GOAL=254*T,AR0=242*T,AR1=258*T;
function solid(cc,rr){return rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&g[rr][cc]==='#';}
var state='title',score=0,bcount=0,lives=3,hp=HPMAX,time=0,pf=0,chkI=-1,pw=0,pwCd=0,combo=0,best=0,cam=0;
var p,cats,crows,springs,movers,meats,bones,turs,boss,bossStarted,bossDead,shots,ebs,fx=[],pops=[],chargeT=0,fireCd=0;
function makeCats(){return CATS0.map(function(cc){return {x:cc*T+3,y:11*T-26,w:34,h:26,d:-1,dead:0};});}
function makeCrows(){return CROWS0.map(function(a){return {x:a[0]*T,x0:a[0]*T,x1:a[1]*T,by:a[2],y:a[2],w:30,h:22,d:1,sp:a[3],dead:0,vy:0,seed:a[0]};});}
function makeTurs(){return TURS0.map(function(cc){return {x:cc*T+5,y:11*T-26,w:30,h:26,hp:3,cd:80,d:-1,dead:0,ht:0};});}
function makeBoss(){return {x:250*T,y:-100,w:70,h:56,vx:0,vy:0,on:false,d:-1,hp:20,max:20,st:'wait',t:0,inv:0,hopN:0,fired:false,dieT:0};}
function resetPlayer(full){p={x:(chkI>=0&&!full)?CHKS[chkI]:2*T,y:11*T-30,w:30,h:30,vx:0,vy:0,dir:1,on:false,ph:0,inv:full?0:90,coy:0,buf:0,dj:false,sqt:0,stt:0,stun:0};hp=HPMAX;}
function resetAll(){score=0;bcount=0;lives=3;time=0;pf=0;chkI=-1;pw=0;combo=0;fx.length=0;pops.length=0;shots=[];ebs=[];chargeT=0;fireCd=0;
bones=BONES.map(function(b){return {x:b.x,y:b.y,t:false};});
cats=makeCats();crows=makeCrows();turs=makeTurs();boss=makeBoss();bossStarted=false;bossDead=false;
springs=SPRINGS0.map(function(cc){return {x:cc*T+6,y:10*T+16,w:28,h:24,sq:0};});
movers=[{o:'x',a0:100*T+4,a1:105*T-84,x:100*T+4,y:8*T+14,w:80,h:14,per:260,ph:0,dx:0,dy:0},
{o:'x',a0:200*T+4,a1:207*T-84,x:200*T+4,y:8*T+14,w:80,h:14,per:300,ph:0.8,dx:0,dy:0},
{o:'y',a0:9*T+14,a1:5*T+14,x:212*T+4,y:9*T+14,w:80,h:14,per:280,ph:1.5,dx:0,dy:0}];
meats=MEATS0.map(function(a){return {x:a[0],y:a[1],t:false};});
resetPlayer(true);}
resetAll();
var A=null;
function initA(){if(A)return;try{A=new (window.AudioContext||window.webkitAudioContext)();if(A.resume)A.resume();}catch(e){}}
function tone(f0,f1,d,type,vol,delay){if(!A)return;try{var t=A.currentTime+(delay||0);var o=A.createOscillator(),gn=A.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);gn.gain.setValueAtTime(vol||0.12,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn);gn.connect(A.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}
function sfx(n){if(n==='jump')tone(280,620,0.13,'square',0.08);
else if(n==='dj')tone(420,820,0.11,'square',0.08);
else if(n==='spring')tone(170,920,0.2,'square',0.12);
else if(n==='bone')tone(880,1350,0.09,'sine',0.1);
else if(n==='stomp')tone(220,70,0.14,'triangle',0.15);
else if(n==='hit')tone(320,110,0.3,'sawtooth',0.11);
else if(n==='shot')tone(980,620,0.06,'square',0.06);
else if(n==='chg')tone(1150,1650,0.12,'sine',0.09);
else if(n==='big')tone(620,200,0.2,'sawtooth',0.12);
else if(n==='tink')tone(1500,900,0.05,'square',0.07);
else if(n==='tshot')tone(300,180,0.09,'square',0.08);
else if(n==='bhit')tone(520,300,0.08,'triangle',0.1);
else if(n==='boom'){tone(160,55,0.35,'sawtooth',0.14);tone(90,40,0.4,'triangle',0.12,0.05);}
else if(n==='chk'){tone(523,0,0.09,'sine',0.09);tone(784,0,0.12,'sine',0.09,0.09);}
else if(n==='power'){[392,523,659,784].forEach(function(f,ii){tone(f,0,0.09,'square',0.09,ii*0.07);});}
else if(n==='start'){tone(523,0,0.1,'square',0.07);tone(659,0,0.1,'square',0.07,0.1);tone(784,0,0.14,'square',0.07,0.2);}
else if(n==='clear'){[523,659,784,1047].forEach(function(f,ii){tone(f,0,0.16,'triangle',0.11,ii*0.13);});}}
function spawnFx(x,y,n,col,spd,grav,life,sz){for(var k=0;k<n;k++){if(fx.length>140)return;var a=Math.random()*TAU,s=spd*(0.4+Math.random()*0.6);fx.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*0.4,g:grav,l:life,ml:life,c:col,s:sz*(0.6+Math.random()*0.7)});}}
function spawnRing(x,y){for(var k=0;k<8;k++){var a=k/8*TAU;fx.push({x:x,y:y,vx:Math.cos(a)*2.6,vy:Math.sin(a)*2.6,g:0,l:32,ml:32,c:k%2?'#ffd23e':'#ffffff',s:4});}}
function confetti(){var CO=['#e2554a','#f0a03c','#79c94f','#5aa9e6','#c58ae0'];for(var k=0;k<70;k++){fx.push({x:cam+Math.random()*W,y:-10-Math.random()*80,vx:(Math.random()-0.5)*1.6,vy:1+Math.random()*2,g:0.05,l:220,ml:220,c:CO[k%5],s:3+Math.random()*3});}}
function pop(x,y,txt,col){pops.push({x:x,y:y,t:txt,c:col||'#5a4632',l:60,w:0});}
var inp={l:false,r:false,j:false,jp:false,s:false};
function tryFire(big){if(state!=='play')return;
if(!big&&(shots.length>=3||fireCd>0))return;
var sx=p.dir>0?p.x+p.w+2:p.x-8,sy=p.y+9;
shots.push({x:sx,y:sy,vx:p.dir*(big?8.5:7.5),big:!!big,dmg:big?3:1});
fireCd=9;sfx(big?'big':'shot');}
function press(k,v){
if(k==='s'){if(v&&!inp.s){tryFire(false);chargeT=0;}
if(!v&&inp.s){if(chargeT>=45)tryFire(true);chargeT=0;}
inp.s=v;return;}
if(k==='j'){if(v&&!inp.j)inp.jp=true;inp.j=v;if(v&&state==='title')start();}else inp[k]=v;}
function bindBtn(id,k){var el=document.getElementById(id);var dn=function(e){e.preventDefault();initA();press(k,true);};var up=function(e){e.preventDefault();press(k,false);};el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);el.addEventListener('touchstart',function(e){e.preventDefault();},{passive:false});el.addEventListener('contextmenu',function(e){e.preventDefault();});}
bindBtn('bL','l');bindBtn('bR','r');bindBtn('bJ','j');bindBtn('bS','s');
cv.addEventListener('touchstart',function(e){e.preventDefault();},{passive:false});
var KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j',KeyZ:'s',KeyX:'s',KeyK:'s'};
window.addEventListener('keydown',function(e){var k=KM[e.code];if(!k)return;e.preventDefault();initA();if(k==='s'&&e.repeat)return;press(k,true);});
window.addEventListener('keyup',function(e){var k=KM[e.code];if(!k)return;press(k,false);});
var ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovD=document.getElementById('ovD'),ovB=document.getElementById('ovB');
ovB.addEventListener('click',function(){initA();if(state==='title'){start();}else{resetAll();start();}});
function start(){state='play';ov.style.display='none';sfx('start');}
function showOv(t,d,b){ovT.textContent=t;ovD.innerHTML=d;ovB.textContent=b;ov.style.display='flex';}
function fmt(s){var m=Math.floor(s/60),ss=s%60;return m+':'+(ss<10?'0':'')+ss;}
function gameOver(){state='over';showOv('ゲームオーバー','スコア：'+score+' ／ 骨：'+bcount+' 本','もう一度');}
function clearGame(){state='clear';sfx('clear');confetti();
var sec=Math.floor(pf/60),tb=Math.max(0,300-sec)*10,total=score+tb,nb='';
if(total>best){best=total;nb='<br>ベスト記録を更新';}
score=total;
showOv('ゴール','タイム：'+fmt(sec)+' ／ 骨：'+bcount+' / '+NB+' 本<br>タイムボーナス：+'+tb+'<br>合計スコア：'+total+nb,'もう一度あそぶ');}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function hitTiles(o,ax){var c1=Math.max(0,Math.floor(o.x/T)),c2=Math.min(COLS-1,Math.floor((o.x+o.w-0.01)/T));var r1=Math.max(0,Math.floor(o.y/T)),r2=Math.min(ROWS-1,Math.floor((o.y+o.h-0.01)/T));for(var rr=r1;rr<=r2;rr++)for(var cc=c1;cc<=c2;cc++){if(!solid(cc,rr))continue;if(ax==='x'){if(o.vx>0)o.x=cc*T-o.w;else if(o.vx<0)o.x=(cc+1)*T;o.vx=0;}else{if(o.vy>0){o.y=rr*T-o.h;o.vy=0;o.on=true;}else if(o.vy<0){o.y=(rr+1)*T;o.vy=0;}}}}
function loseLife(){lives--;combo=0;pw=0;sfx('hit');spawnFx(p.x+15,p.y+15,12,'#e2554a',2.8,0.1,32,3);shots.length=0;ebs.length=0;
if(bossStarted&&!bossDead){boss=makeBoss();bossStarted=false;}
if(lives<=0){resetPlayer(false);gameOver();}else resetPlayer(false);}
function hurtHP(d,fromX){if(p.inv>0||pw>0)return;
hp-=d;p.inv=60;p.stun=12;combo=0;
p.vx=(p.x+p.w/2<fromX?-1:1)*3.5;p.vy=-4;
sfx('hit');spawnFx(p.x+15,p.y+15,7,'#e2554a',2.2,0.1,24,2.6);
if(hp<=0)loseLife();}
function killE(e2,pts){e2.dead=e2.dead||1;score+=pts;pop(e2.x+e2.w/2,e2.y-6,'+'+pts,'#a86b1e');spawnFx(e2.x+e2.w/2,e2.y+10,8,'#ffd23e',2.2,0.08,26,2.6);sfx('stomp');}
function stompE(e2,isCrow){e2.dead=1;combo++;var pts=100*combo;score+=pts;
pop(e2.x+10,e2.y-6,combo>1?('コンボ×'+combo+'  +'+pts):('+'+pts),combo>1?'#c25a1e':'#5a4632');
spawnFx(e2.x+15,e2.y+8,8,'#ffffff',2.2,0.06,24,2.4);p.vy=isCrow?-9.5:-8.5;p.dj=false;sfx('stomp');}
function dmgBoss(d){if(boss.inv>0||boss.st==='wait'||boss.st==='intro'||boss.st==='die')return;
boss.hp-=d;boss.inv=12;sfx('bhit');spawnFx(boss.x+35,boss.y+24,5,'#ffffff',2,0.05,16,2.4);
if(boss.hp<=0){boss.hp=0;boss.st='die';boss.dieT=0;boss.vx=0;}}
function step(){time++;pf++;
var m,u,pos;
for(i=0;i<movers.length;i++){m=movers[i];u=0.5+0.5*Math.sin(time*TAU/m.per+m.ph);pos=m.a0+(m.a1-m.a0)*u;
if(m.o==='x'){m.dx=pos-m.x;m.x=pos;m.dy=0;}else{m.dy=pos-m.y;m.y=pos;m.dx=0;}}
if(inp.s){chargeT++;if(chargeT===45)sfx('chg');
if(chargeT>12&&(time&3)===0)spawnFx(p.x+15+(Math.random()-0.5)*30,p.y+15+(Math.random()-0.5)*30,1,chargeT>=45?'#ffd23e':'#9fd4ff',0.6,-0.03,14,2);}
if(fireCd>0)fireCd--;
var ACC=0.65,MX=pw>0?5.4:4.3;
if(p.stun>0){p.stun--;}
else if(inp.l&&!inp.r){p.vx=Math.max(p.vx-ACC,-MX);p.dir=-1;}
else if(inp.r&&!inp.l){p.vx=Math.min(p.vx+ACC,MX);p.dir=1;}
else{p.vx*=0.72;if(p.vx>-0.1&&p.vx<0.1)p.vx=0;}
p.coy=p.on?7:p.coy-1;
if(inp.jp){p.buf=8;inp.jp=false;}else p.buf--;
if(p.stun<=0&&p.buf>0){
if(p.coy>0){p.vy=-13.6;p.coy=0;p.buf=0;p.dj=false;p.stt=6;sfx('jump');}
else if(!p.dj){p.dj=true;p.vy=-11.8;p.buf=0;p.stt=6;spawnFx(p.x+15,p.y+30,6,'#dfeaf2',1.8,0.04,20,2.4);sfx('dj');}}
if(!inp.j&&p.vy<-4.5)p.vy=-4.5;
p.vy=Math.min(p.vy+0.55,15);
p.x+=p.vx;
var lx=bossStarted&&!bossDead?AR0+4:0,rx=bossStarted&&!bossDead?AR1-p.w-4:WORLD-p.w;
if(p.x<lx){p.x=lx;p.vx=0;}if(p.x>rx){p.x=rx;p.vx=0;}
hitTiles(p,'x');
var wasOn=p.on,fallV=p.vy;
p.on=false;p.y+=p.vy;
var s;
for(i=0;i<springs.length;i++){s=springs[i];if(s.sq>0)s.sq--;
if(p.vy>=0&&p.x+p.w>s.x+3&&p.x<s.x+s.w-3){var ft2=p.y+p.h;
if(ft2>=s.y-2&&ft2<=s.y+s.h+2){p.y=s.y-p.h;p.vy=-20;p.dj=false;s.sq=8;p.stt=8;spawnFx(s.x+14,s.y,7,'#ffffff',2,0.05,22,2.2);sfx('spring');}}}
hitTiles(p,'y');
for(i=0;i<movers.length;i++){m=movers[i];
if(p.vy>=0&&p.x+p.w>m.x&&p.x<m.x+m.w){var ft=p.y+p.h;
if(ft>=m.y-8&&ft<=m.y+m.h+6){p.y=m.y-p.h;p.vy=0;p.on=true;p.x+=m.dx;}}}
if(p.on){p.dj=false;combo=0;
if(!wasOn&&fallV>7){p.sqt=6;spawnFx(p.x+15,p.y+30,5,'#c9b08a',1.6,0.06,18,2.4);}}
p.ph+=(p.vx<0?-p.vx:p.vx)*0.35;
if(p.inv>0)p.inv--;
if(pwCd>0)pwCd--;
if(pw>0){pw--;if((time%3)===0)spawnFx(p.x+15+(Math.random()-0.5)*24,p.y+15+(Math.random()-0.5)*24,1,'#ffd23e',0.8,-0.02,20,2);}
if(p.sqt>0)p.sqt--;if(p.stt>0)p.stt--;
var b,pcx=p.x+15,pcy=p.y+15;
