name: 挙動検証

# push と PR のたびに GitHub のマシンで実行する。
# ゲームを3600フレーム自動プレイし、描画呼び出し列のダイジェストが
# tools/replay-baseline.txt と一致するかを確認する。
on:
  push:
  pull_request:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 手元の環境と揃えるため Node 20 を使う
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: リプレイダイジェストの照合
        run: |
          mkdir -p /tmp/dumps
          rc=0
          for scenario in run boss stage2; do
            expected=$(grep "^${scenario}=" tools/replay-baseline.txt | cut -d= -f2)
            if [ -z "$expected" ]; then
              echo "tools/replay-baseline.txt に ${scenario} の基準値がありません" >&2
              exit 1
            fi
            EXPECT="$expected" SCENARIO="$scenario" VERBOSE=1 \
              DUMP=/tmp/dumps/$scenario.txt DUMP_LIMIT=200000 \
              node tools/replay-check.mjs || rc=1
          done
          exit $rc

      # 環境差やリグレッションの調査用。落ちたときに描画ログを持ち帰れるようにする
      - name: 描画ログの保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-dumps
          path: /tmp/dumps

      - name: 外部リソース参照がないことの確認
        run: |
          if grep -rE 'https?://' index.html src/; then
            echo "外部URLへの参照が見つかりました。このゲームは依存ゼロを保つ方針です。" >&2
            exit 1
          fi
          echo "外部リソース参照なし"
